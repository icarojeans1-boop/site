name: Guardar fotos do banner no site
on:
  push:
    paths: ['stories.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: banner-local
  cancel-in-progress: true
jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/banner_local.py
      - run: |
          git config user.name "icarojeans1-boop"
          git config user.email "icarojeans1-boop@users.noreply.github.com"
          git add stories.json img/banner
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Banner: copias das fotos no site"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
