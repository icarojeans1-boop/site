name: Baixar fotos dos stories
on:
  push:
    paths: ['ig/pedido.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: baixar-stories
  cancel-in-progress: false
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/baixar_stories.py
      - run: |
          git config user.name "icarojeans1-boop"
          git config user.email "icarojeans1-boop@users.noreply.github.com"
          git add ig
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fotos dos stories"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
