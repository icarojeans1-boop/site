name: Guardar fotos na galeria do site
on:
  push:
    paths: ['ig/post/**', 'ig/historico.json']
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: galeria
  cancel-in-progress: false
jobs:
  galeria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 .github/galeria.py
      - run: |
          git config user.name "icarojeans1-boop"
          git config user.email "icarojeans1-boop@users.noreply.github.com"
          git add galeria.json img/galeria
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Galeria: fotos do post do dia"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
